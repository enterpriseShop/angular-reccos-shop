<div class="relative w-full">
  <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400 dark:text-slate-500">
    <app-icon name="search" size="w-4 h-4" />
  </div>

  <input
    type="text"
    [value]="value()"
    [placeholder]="placeholder()"
    (input)="onInput($event)"
    (keydown.enter)="onEnter()"
    class="w-full pl-9 pr-8 py-2 text-sm bg-gray-50 dark:bg-slate-800/80 border border-gray-200 dark:border-slate-700/80 rounded-[8px] text-gray-900 dark:text-slate-100 placeholder-gray-400 dark:placeholder-slate-500 focus:outline-none focus:bg-white dark:focus:bg-slate-800 focus:border-[#4F8A6B] focus:ring-2 focus:ring-[#4F8A6B]/20 transition-all duration-150"
  />

  @if (value()) {
    <button
      type="button"
      (click)="clear()"
      class="absolute inset-y-0 right-0 pr-2.5 flex items-center text-gray-400 hover:text-gray-600 dark:hover:text-slate-300 transition-colors"
      title="Limpar pesquisa"
    >
      <app-icon name="x" size="w-4 h-4" />
    </button>
  }
</div>
