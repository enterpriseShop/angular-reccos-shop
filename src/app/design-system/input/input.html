<div class="w-full">
  @if (label()) {
  <label [for]="inputId()" class="block text-xs font-medium text-gray-700 dark:text-slate-300 mb-1">
    {{ label() }} @if (required()) {
    <span class="text-red-500">*</span>
    }
  </label>
  }

  <div class="relative rounded-[8px]">
    @if (iconPrefix()) {
    <div
      class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400 dark:text-slate-500"
    >
      <app-icon [name]="iconPrefix()!" size="w-4 h-4" />
    </div>
    }

    <input
      [id]="inputId()"
      [type]="type()"
      [value]="value()"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      [readOnly]="readonly()"
      [attr.step]="type() === 'number' ? step() : null"
      [attr.min]="type() === 'number' ? min() : null"
      [attr.max]="type() === 'number' ? max() : null"
      (input)="onInput($event)"
      [class]="inputClasses()"
    />
  </div>

  @if (error()) {
  <p class="mt-1 text-xs text-[#D66A6A] font-medium flex items-center gap-1">
    <app-icon name="alert-circle" size="w-3.5 h-3.5 shrink-0" />
    {{ error() }}
  </p>
  } @else if (helperText()) {
  <p class="mt-1 text-xs text-gray-500 dark:text-slate-400">{{ helperText() }}</p>
  }
</div>
