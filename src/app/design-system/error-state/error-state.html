<div
  class="flex flex-col items-center justify-center text-center p-8 border border-rose-200 dark:border-rose-900/50 rounded-[12px] bg-rose-50/30 dark:bg-rose-950/20 my-4"
>
  <div class="p-3 bg-rose-100 dark:bg-rose-900/50 text-[#D66A6A] rounded-xl mb-3">
    <app-icon name="alert-circle" size="w-8 h-8" />
  </div>

  <h3 class="text-sm font-semibold text-gray-900 dark:text-slate-100 mb-1">{{ title() }}</h3>

  <p class="text-xs text-gray-600 dark:text-slate-300 max-w-sm mb-4 leading-relaxed">
    {{ message() }}
  </p>

  <app-button variant="outline" size="sm" iconStart="refresh-cw" (btnClick)="onRetry()">
    Tentar Novamente
  </app-button>
</div>
