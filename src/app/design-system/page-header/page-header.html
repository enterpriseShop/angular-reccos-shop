<div class="mb-6">
  @if (breadcrumbs() && breadcrumbs()!.length > 0) {
  <app-breadcrumb [items]="breadcrumbs()!" />
  }

  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <div>
      <h1
        class="text-2xl sm:text-[28px] font-semibold text-gray-900 dark:text-slate-100 tracking-tight leading-tight"
      >
        {{ title() }}
      </h1>
      @if (subtitle()) {
      <p class="text-xs sm:text-sm text-gray-500 dark:text-slate-400 mt-1">{{ subtitle() }}</p>
      }
    </div>

    <div class="flex items-center gap-2 shrink-0">
      <ng-content select="[actions]" />
    </div>
  </div>
</div>
