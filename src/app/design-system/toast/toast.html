<div class="fixed bottom-12 right-6 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none">
  @for (toast of toastService.toasts(); track toast.id) {
  <div
    [class]="toastClasses(toast.type)"
    class="pointer-events-auto p-4 rounded-[12px] shadow-lg border flex items-start gap-3 transform transition-all duration-200 animate-in slide-in-from-right-full"
  >
    <div [class]="iconColor(toast.type)" class="shrink-0 mt-0.5">
      <app-icon [name]="getIcon(toast.type)" size="w-5 h-5" />
    </div>

    <div class="flex-1">
      <h4 class="text-xs font-semibold text-gray-900 dark:text-slate-100">{{ toast.title }}</h4>
      @if (toast.message) {
      <p class="text-xs text-gray-600 dark:text-slate-300 mt-0.5 leading-normal">
        {{ toast.message }}
      </p>
      }
    </div>

    <button
      type="button"
      (click)="toastService.remove(toast.id)"
      class="text-gray-400 hover:text-gray-600 dark:hover:text-slate-200 p-1 rounded-md"
    >
      <app-icon name="x" size="w-4 h-4" />
    </button>
  </div>
  }
</div>
