<div class="relative inline-block text-left">
  <!-- Trigger slot -->
  <div (click)="toggleOpen($event)" (keydown.enter)="toggleOpen($event)" tabindex="0" role="button">
    <ng-content select="[trigger]" />
  </div>

  <!-- Dropdown Popover -->
  @if (isOpen()) {
  <div
    [class]="alignClasses()"
    class="absolute z-50 mt-1 min-w-[200px] py-1 bg-white dark:bg-slate-800 rounded-[12px] shadow-lg border border-gray-100 dark:border-slate-700/80 ring-1 ring-black/5 animate-in fade-in duration-100"
  >
    <ng-content select="[header]" />

    @for (item of items(); track item.id) { @if (item.divider) {
    <div class="my-1 border-t border-gray-100 dark:border-slate-700/80"></div>
    } @else {
    <button
      type="button"
      (click)="onSelect(item, $event)"
      [class]="item.danger
              ? 'text-[#D66A6A] hover:bg-rose-50 dark:hover:bg-rose-950/30'
              : 'text-gray-700 dark:text-slate-200 hover:bg-gray-50 dark:hover:bg-slate-700/60'"
      class="w-full px-3.5 py-2 text-left text-xs font-medium flex items-center justify-between transition-colors"
    >
      <div class="flex items-center gap-2">
        @if (item.icon) {
        <app-icon [name]="item.icon" size="w-4 h-4 shrink-0" />
        }
        <span>{{ item.label }}</span>
      </div>

      @if (item.badge) {
      <span
        class="px-1.5 py-0.5 text-[10px] font-semibold bg-gray-100 dark:bg-slate-700 text-gray-600 dark:text-slate-300 rounded"
      >
        {{ item.badge }}
      </span>
      }
    </button>
    } }

    <ng-content />
  </div>
  }
</div>
