<div class="flex flex-col items-center justify-center text-center p-8 border-2 border-dashed border-gray-200 dark:border-slate-700/80 rounded-[12px] bg-gray-50/50 dark:bg-slate-800/30 my-4">
  <div class="p-4 bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-gray-100 dark:border-slate-700 mb-3 text-gray-400 dark:text-slate-500">
    <app-icon [name]="icon()" size="w-8 h-8" />
  </div>

  <h3 class="text-sm font-semibold text-gray-900 dark:text-slate-100 mb-1">
    {{ title() }}
  </h3>

  <p class="text-xs text-gray-500 dark:text-slate-400 max-w-sm mb-4 leading-relaxed">
    {{ description() }}
  </p>

  @if (actionLabel()) {
    <app-button variant="primary" size="sm" iconStart="plus" (btnClick)="onAction()">
      {{ actionLabel() }}
    </app-button>
  }
</div>
