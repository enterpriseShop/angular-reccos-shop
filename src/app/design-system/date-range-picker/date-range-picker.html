<div class="relative w-full">
  @if (label()) {
  <span class="block text-[11px] font-semibold text-gray-500 dark:text-slate-400 mb-1">
    {{ label() }}
  </span>
  }

  <!-- Main Input Button -->
  <div
    (click)="togglePopover()"
    (keydown.enter)="togglePopover()"
    tabindex="0"
    role="button"
    [class.ring-2]="isOpen()"
    [class.ring-[#4F8A6B]/40]="isOpen()"
    [class.border-[#4F8A6B]]="isOpen() || hasRange()"
    class="w-full px-3 py-2 text-xs rounded-xl bg-gray-50 dark:bg-slate-700/60 border border-gray-200 dark:border-slate-600 text-gray-900 dark:text-slate-100 flex items-center justify-between gap-2 cursor-pointer hover:bg-gray-100/80 dark:hover:bg-slate-700 transition-all select-none"
  >
    <div class="flex items-center gap-2 min-w-0">
      <app-icon name="calendar" size="w-4 h-4 text-[#4F8A6B] dark:text-[#5BAE6A] shrink-0" />
      <span class="truncate font-medium" [class.text-gray-400]="!hasRange()">
        {{ displayText() }}
      </span>
    </div>

    <div class="flex items-center gap-1 shrink-0">
      @if (hasRange()) {
      <button
        type="button"
        (click)="clear($event)"
        class="p-1 rounded-md text-gray-400 hover:text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/40 transition-colors"
        title="Limpar período"
      >
        <app-icon name="x" size="w-3.5 h-3.5" />
      </button>
      }
      <app-icon
        name="chevron-down"
        size="w-4 h-4 text-gray-400 transition-transform duration-200"
        [class.rotate-180]="isOpen()"
      />
    </div>
  </div>

  <!-- Popover Menu -->
  @if (isOpen()) {
  <div
    class="absolute right-0 mt-2 w-72 sm:w-80 bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-gray-200 dark:border-slate-700 p-4 z-50 space-y-4"
  >
    <div
      class="flex items-center justify-between border-b border-gray-100 dark:border-slate-700 pb-2.5"
    >
      <span class="text-xs font-bold text-gray-900 dark:text-slate-100 flex items-center gap-1.5">
        <app-icon name="calendar" size="w-4 h-4 text-[#4F8A6B]" />
        Filtrar por Período
      </span>
      <button
        type="button"
        (click)="closePopover()"
        class="text-gray-400 hover:text-gray-600 dark:hover:text-slate-200 p-1 rounded-lg"
      >
        <app-icon name="x" size="w-4 h-4" />
      </button>
    </div>

    <!-- Quick Presets -->
    <div class="space-y-1">
      <span
        class="text-[10px] font-semibold uppercase tracking-wider text-gray-400 dark:text-slate-500"
      >
        Atalhos Rápidos
      </span>
      <div class="grid grid-cols-2 gap-1.5 pt-1">
        <button
          type="button"
          (click)="applyPreset('today')"
          class="px-2.5 py-1.5 text-xs text-left font-medium rounded-lg bg-gray-50 dark:bg-slate-700/60 hover:bg-[#EAF4EE] hover:text-[#38624C] dark:hover:bg-[#4F8A6B]/20 dark:hover:text-[#5BAE6A] transition-colors"
        >
          Hoje
        </button>
        <button
          type="button"
          (click)="applyPreset('last7')"
          class="px-2.5 py-1.5 text-xs text-left font-medium rounded-lg bg-gray-50 dark:bg-slate-700/60 hover:bg-[#EAF4EE] hover:text-[#38624C] dark:hover:bg-[#4F8A6B]/20 dark:hover:text-[#5BAE6A] transition-colors"
        >
          Últimos 7 dias
        </button>
        <button
          type="button"
          (click)="applyPreset('last30')"
          class="px-2.5 py-1.5 text-xs text-left font-medium rounded-lg bg-gray-50 dark:bg-slate-700/60 hover:bg-[#EAF4EE] hover:text-[#38624C] dark:hover:bg-[#4F8A6B]/20 dark:hover:text-[#5BAE6A] transition-colors"
        >
          Últimos 30 dias
        </button>
        <button
          type="button"
          (click)="applyPreset('thisMonth')"
          class="px-2.5 py-1.5 text-xs text-left font-medium rounded-lg bg-gray-50 dark:bg-slate-700/60 hover:bg-[#EAF4EE] hover:text-[#38624C] dark:hover:bg-[#4F8A6B]/20 dark:hover:text-[#5BAE6A] transition-colors"
        >
          Mês Atual
        </button>
      </div>
    </div>

    <!-- Date Inputs -->
    <div class="grid grid-cols-2 gap-2 pt-1 border-t border-gray-100 dark:border-slate-700/80">
      <div>
        <label
          for="temp-date-from-input"
          class="block text-[11px] font-medium text-gray-500 dark:text-slate-400 mb-1"
        >
          Data Inicial
        </label>
        <input
          id="temp-date-from-input"
          type="date"
          [value]="tempFrom()"
          (change)="tempFrom.set($any($event.target).value)"
          class="w-full px-2.5 py-1.5 text-xs rounded-lg bg-gray-50 dark:bg-slate-700/80 border border-gray-200 dark:border-slate-600 text-gray-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-[#4F8A6B]/40"
        />
      </div>
      <div>
        <label
          for="temp-date-to-input"
          class="block text-[11px] font-medium text-gray-500 dark:text-slate-400 mb-1"
        >
          Data Final
        </label>
        <input
          id="temp-date-to-input"
          type="date"
          [value]="tempTo()"
          (change)="tempTo.set($any($event.target).value)"
          class="w-full px-2.5 py-1.5 text-xs rounded-lg bg-gray-50 dark:bg-slate-700/80 border border-gray-200 dark:border-slate-600 text-gray-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-[#4F8A6B]/40"
        />
      </div>
    </div>

    <!-- Footer Actions -->
    <div
      class="flex items-center justify-between gap-2 pt-2 border-t border-gray-100 dark:border-slate-700/80"
    >
      <app-button variant="ghost" size="sm" (btnClick)="clearAll()">Limpar</app-button>
      <app-button variant="primary" size="sm" (btnClick)="applyCustomRange()">
        Aplicar Período
      </app-button>
    </div>
  </div>
  }
</div>
