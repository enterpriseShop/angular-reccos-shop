<div class="w-full">
  @if (label()) {
    <label [for]="selectId()" class="block text-xs font-medium text-gray-700 dark:text-slate-300 mb-1">
      {{ label() }}
      @if (required()) {
        <span class="text-red-500">*</span>
      }
    </label>
  }

  <div class="relative rounded-[8px]">
    <select
      [id]="selectId()"
      [value]="value()"
      [disabled]="disabled()"
      (change)="onChange($event)"
      class="w-full pl-3 pr-9 py-2 text-sm bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 rounded-[8px] text-gray-900 dark:text-slate-100 appearance-none focus:outline-none focus:border-[#4F8A6B] focus:ring-2 focus:ring-[#4F8A6B]/20 disabled:bg-gray-100 dark:disabled:bg-slate-900 disabled:cursor-not-allowed transition-colors"
    >
      @if (placeholder()) {
        <option value="" disabled [selected]="!value()">{{ placeholder() }}</option>
      }
      @for (option of options(); track option.value) {
        <option [value]="option.value" [disabled]="option.disabled" [selected]="option.value === value()">
          {{ option.label }}
        </option>
      }
    </select>

    <div class="absolute inset-y-0 right-0 pr-2.5 flex items-center pointer-events-none text-gray-400 dark:text-slate-500">
      <app-icon name="chevron-down" size="w-4 h-4" />
    </div>
  </div>

  @if (error()) {
    <p class="mt-1 text-xs text-[#D66A6A] font-medium flex items-center gap-1">
      <app-icon name="alert-circle" size="w-3.5 h-3.5 shrink-0" />
      {{ error() }}
    </p>
  }
</div>
