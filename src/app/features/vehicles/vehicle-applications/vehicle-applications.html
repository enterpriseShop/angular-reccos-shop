<!-- Page Header -->
<app-page-header
  title="Aplicações de Veículos"
  subtitle="Mapeamento e compatibilidade de veículos (montadora, modelo, versão, motorização e faixa de anos) para o catálogo de autopeças."
  [breadcrumbs]="[
    { label: 'Veículos', route: '/vehicles/brands' },
    { label: 'Aplicações' }
  ]"
>
  <div actions class="flex items-center gap-2">
    <app-button variant="primary" size="sm" iconStart="plus" (btnClick)="newApplication()">
      Nova Aplicação
    </app-button>
  </div>
</app-page-header>

<!-- Quick KPI Summary Strip -->
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-4">
  <div
    class="bg-white dark:bg-slate-800 rounded-xl p-3.5 border border-gray-200/80 dark:border-slate-700/80 flex items-center justify-between shadow-2xs"
  >
    <div class="flex items-center gap-3">
      <div
        class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-700 text-gray-700 dark:text-slate-300 flex items-center justify-center"
      >
        <app-icon name="calendar" size="w-4 h-4" />
      </div>
      <div>
        <span class="text-[11px] font-medium text-gray-500 dark:text-slate-400 block">
          Total de Aplicações
        </span>
        <span class="text-sm font-bold text-gray-900 dark:text-slate-100">
          {{ totalCount() }} cadastradas
        </span>
      </div>
    </div>
  </div>

  <div
    class="bg-white dark:bg-slate-800 rounded-xl p-3.5 border border-gray-200/80 dark:border-slate-700/80 flex items-center justify-between shadow-2xs"
  >
    <div class="flex items-center gap-3">
      <div
        class="w-8 h-8 rounded-lg bg-emerald-100 dark:bg-[#4F8A6B]/20 text-[#4F8A6B] dark:text-[#5BAE6A] flex items-center justify-center"
      >
        <app-icon name="check-circle" size="w-4 h-4" />
      </div>
      <div>
        <span class="text-[11px] font-medium text-gray-500 dark:text-slate-400 block">
          Aplicações Ativas
        </span>
        <span class="text-sm font-bold text-gray-900 dark:text-slate-100">
          {{ activeCount() }} ativas
        </span>
      </div>
    </div>
  </div>

  <div
    class="bg-white dark:bg-slate-800 rounded-xl p-3.5 border border-gray-200/80 dark:border-slate-700/80 flex items-center justify-between shadow-2xs"
  >
    <div class="flex items-center gap-3">
      <div
        class="w-8 h-8 rounded-lg bg-blue-100 dark:bg-[#5A8DEE]/20 text-[#5A8DEE] flex items-center justify-center"
      >
        <app-icon name="car" size="w-4 h-4" />
      </div>
      <div>
        <span class="text-[11px] font-medium text-gray-500 dark:text-slate-400 block">
          Montadoras Atendidas
        </span>
        <span class="text-sm font-bold text-gray-900 dark:text-slate-100">
          {{ distinctBrandsCount() }} marcas
        </span>
      </div>
    </div>
  </div>

  <div
    class="bg-white dark:bg-slate-800 rounded-xl p-3.5 border border-gray-200/80 dark:border-slate-700/80 flex items-center justify-between shadow-2xs"
  >
    <div class="flex items-center gap-3">
      <div
        class="w-8 h-8 rounded-lg bg-amber-100 dark:bg-amber-900/30 text-amber-600 dark:text-amber-400 flex items-center justify-center"
      >
        <app-icon name="layers" size="w-4 h-4" />
      </div>
      <div>
        <span class="text-[11px] font-medium text-gray-500 dark:text-slate-400 block">
          Modelos Vinculados
        </span>
        <span class="text-sm font-bold text-gray-900 dark:text-slate-100">
          {{ distinctModelsCount() }} modelos
        </span>
      </div>
    </div>
  </div>
</div>

<!-- Filter Toolbar -->
<app-toolbar>
  <div start class="flex-1 grid grid-cols-1 sm:grid-cols-3 gap-3 w-full">
    <app-search-input
      [value]="searchQuery()"
      (valueChange)="onSearchChange($event)"
      placeholder="Filtrar por montadora, modelo, motor, ano..."
    />

    <app-select
      [value]="selectedBrand()"
      (valueChange)="onBrandFilterChange($event)"
      [options]="brandFilterOptions()"
      placeholder="Todas as Montadoras"
    />

    <app-select
      [value]="selectedStatus()"
      (valueChange)="onStatusChange($event)"
      [options]="[]"
      placeholder="Todos os Status"
    />
  </div>

  <div end class="flex items-center gap-2">
    <app-button variant="ghost" size="sm" iconStart="refresh-cw" (btnClick)="resetFilters()">
      Limpar
    </app-button>
  </div>
</app-toolbar>

<!-- Table + Integrated Pagination Container -->
<div class="w-full">
  <app-data-table
    [columns]="columns"
    [data]="paginatedApplications()"
    [actions]="actions"
    [loading]="loading()"
    [roundedBottom]="false"
  />

  <app-pagination
    [currentPage]="currentPage()"
    [totalItems]="filteredApplications().length"
    [pageSizeOptions]="[5, 10, 25, 50]"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
  />
</div>

<!-- Delete Confirmation Dialog -->
<app-confirm-dialog
  [isOpen]="deleteDialogOpen()"
  title="Excluir Aplicação de Veículo"
  [message]="'Tem certeza de que deseja remover esta aplicação de veículo (' + (selectedAppForDelete()?.brand?.name || '') + ' ' + (selectedAppForDelete()?.model?.name || '') + ')? Peças vinculadas a esta aplicação deixarão de ser encontradas para este veículo.'"
  type="danger"
  confirmText="Excluir Aplicação"
  cancelText="Cancelar"
  (confirmAction)="executeDelete()"
  (cancelAction)="deleteDialogOpen.set(false)"
/>

<!-- Vehicle Application Create / Edit / View Drawer Form -->
<app-vehicle-application-form
  [isOpen]="isFormOpen()"
  [mode]="formMode()"
  [application]="selectedApplication()"
  (closeForm)="closeForm()"
  (applicationSaved)="onApplicationSaved()"
/>
