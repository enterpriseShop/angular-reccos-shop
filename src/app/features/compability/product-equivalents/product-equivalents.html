<!-- Page Header -->
<app-page-header
  title="Produtos Equivalentes"
  subtitle="Gestão de peças intercambiáveis e alternativas de aplicação entre produtos do catálogo."
  [breadcrumbs]="[
    { label: 'Compatibilidade', route: '/compatibility/oem-codes' },
    { label: 'Produtos Equivalentes' }
  ]"
>
  <div actions class="flex items-center gap-2">
    <app-button
      variant="primary"
      size="sm"
      iconStart="plus"
      (btnClick)="newEquivalent()"
    >
      Novo Relacionamento
    </app-button>
  </div>
</app-page-header>

<!-- Quick KPI Summary Strip -->
<div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
  <div class="bg-white dark:bg-slate-800 rounded-xl p-3.5 border border-gray-200/80 dark:border-slate-700/80 flex items-center justify-between shadow-2xs">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-700 text-gray-700 dark:text-slate-300 flex items-center justify-center">
        <app-icon name="git-compare" size="w-4 h-4" />
      </div>
      <div>
        <span class="text-[11px] font-medium text-gray-500 dark:text-slate-400 block">Total de Equivalências</span>
        <span class="text-sm font-bold text-gray-900 dark:text-slate-100">{{ totalEquivalentsCount() }} relações</span>
      </div>
    </div>
  </div>

  <div class="bg-white dark:bg-slate-800 rounded-xl p-3.5 border border-gray-200/80 dark:border-slate-700/80 flex items-center justify-between shadow-2xs">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-emerald-100 dark:bg-[#4F8A6B]/20 text-[#4F8A6B] dark:text-[#5BAE6A] flex items-center justify-center">
        <app-icon name="box" size="w-4 h-4" />
      </div>
      <div>
        <span class="text-[11px] font-medium text-gray-500 dark:text-slate-400 block">Peças Origem Mapeadas</span>
        <span class="text-sm font-bold text-gray-900 dark:text-slate-100">{{ uniqueOriginProductsCount() }} produtos</span>
      </div>
    </div>
  </div>

  <div class="bg-white dark:bg-slate-800 rounded-xl p-3.5 border border-gray-200/80 dark:border-slate-700/80 flex items-center justify-between shadow-2xs">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-blue-100 dark:bg-[#5A8DEE]/20 text-[#5A8DEE] flex items-center justify-center">
        <app-icon name="repeat" size="w-4 h-4" />
      </div>
      <div>
        <span class="text-[11px] font-medium text-gray-500 dark:text-slate-400 block">Peças Alternativas</span>
        <span class="text-sm font-bold text-gray-900 dark:text-slate-100">{{ uniqueTargetProductsCount() }} alternativas</span>
      </div>
    </div>
  </div>
</div>

<!-- Filter Toolbar -->
<app-toolbar>
  <div start class="flex-1 grid grid-cols-1 sm:grid-cols-3 gap-3 w-full">
    <app-search-input
      [value]="searchQuery()"
      (valueChange)="onSearchChange($event)"
      placeholder="Filtrar por produto ou observação..."
    />

    <app-select
      [value]="selectedOriginId()"
      (valueChange)="onOriginFilterChange($event)"
      [options]="productFilterOptions()"
      placeholder="Produto de Origem"
    />

    <app-select
      [value]="selectedTargetId()"
      (valueChange)="onTargetFilterChange($event)"
      [options]="productFilterOptions()"
      placeholder="Produto Equivalente"
    />
  </div>

  <div end class="flex items-center gap-2">
    <app-button
      variant="ghost"
      size="sm"
      iconStart="refresh-cw"
      (btnClick)="resetFilters()"
    >
      Limpar
    </app-button>
  </div>
</app-toolbar>

<!-- Table + Integrated Pagination Container -->
<div class="w-full">
  <app-data-table
    [columns]="columns"
    [data]="paginatedEquivalents()"
    [actions]="actions"
    [loading]="loading()"
    [roundedBottom]="false"
    emptyTitle="Nenhuma equivalência cadastrada"
    emptyDescription="Vincule produtos que podem atuar como peças intercambiáveis (ex: Filtro Tecfil PSL560 equivalente ao Filtro Mann W712/53)."
  />

  <app-pagination
    [currentPage]="currentPage()"
    [pageSize]="pageSize()"
    [totalItems]="filteredEquivalents().length"
    [pageSizeOptions]="[5, 10, 25, 50]"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)"
  />
</div>

<!-- Product Equivalent Form Drawer -->
<app-product-equivalent-form
  [isOpen]="isFormOpen()"
  [mode]="formMode()"
  [equivalent]="selectedEquivalent()"
  (closeForm)="closeForm()"
  (equivalentSaved)="onEquivalentSaved()"
/>

<!-- Delete Confirmation Dialog -->
<app-confirm-dialog
  [isOpen]="deleteDialogOpen()"
  title="Excluir Relacionamento de Equivalência"
  [message]="'Tem certeza de que deseja remover o vínculo de equivalência entre os produtos ' + (selectedForDelete()?.product?.name || 'Origem') + ' e ' + (selectedForDelete()?.equivalent_product?.name || 'Equivalente') + '? Esta operação remove apenas a equivalência cadastrada; nenhum dos produtos será excluído do catálogo.'"
  confirmText="Excluir Relacionamento"
  cancelText="Cancelar"
  type="danger"
  (confirmAction)="executeDelete()"
  (cancelAction)="deleteDialogOpen.set(false)"
/>
