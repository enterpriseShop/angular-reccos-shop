<!-- Page Header -->
<app-page-header
  title="Tipos de Código"
  subtitle="Classificação padronizada de identificadores secundários (EAN, Código do Fabricante, Código de Catálogo)."
  [breadcrumbs]="[
    { label: 'Compatibilidade', route: '/compatibility/oem-codes' },
    { label: 'Product Codes', route: '/compatibility/product-codes' },
    { label: 'Tipos de Código' }
  ]"
>
  <div actions class="flex items-center gap-2">
    <app-button
      variant="secondary"
      size="sm"
      iconStart="arrow-left"
      (btnClick)="backToProductCodes()"
    >
      Voltar para Product Codes
    </app-button>

    <app-button variant="primary" size="sm" iconStart="plus" (btnClick)="newCodeType()">
      Novo Tipo de Código
    </app-button>
  </div>
</app-page-header>

<!-- Quick KPI Summary Strip -->
<div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
  <div
    class="bg-white dark:bg-slate-800 rounded-xl p-3.5 border border-gray-200/80 dark:border-slate-700/80 flex items-center justify-between shadow-2xs"
  >
    <div class="flex items-center gap-3">
      <div
        class="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-700 text-gray-700 dark:text-slate-300 flex items-center justify-center"
      >
        <app-icon name="tag" size="w-4 h-4" />
      </div>
      <div>
        <span class="text-[11px] font-medium text-gray-500 dark:text-slate-400 block">
          Total de Tipos
        </span>
        <span class="text-sm font-bold text-gray-900 dark:text-slate-100">
          {{ totalTypesCount() }} tipos
        </span>
      </div>
    </div>
  </div>

  <div
    class="bg-white dark:bg-slate-800 rounded-xl p-3.5 border border-gray-200/80 dark:border-slate-700/80 flex items-center justify-between shadow-2xs"
  >
    <div class="flex items-center gap-3">
      <div
        class="w-8 h-8 rounded-lg bg-emerald-100 dark:bg-[#4F8A6B]/20 text-[#4F8A6B] dark:text-[#5BAE6A] flex items-center justify-center"
      >
        <app-icon name="check-circle" size="w-4 h-4" />
      </div>
      <div>
        <span class="text-[11px] font-medium text-gray-500 dark:text-slate-400 block">
          Tipos Ativos
        </span>
        <span class="text-sm font-bold text-gray-900 dark:text-slate-100">
          {{ activeTypesCount() }} ativos
        </span>
      </div>
    </div>
  </div>

  <div
    class="bg-white dark:bg-slate-800 rounded-xl p-3.5 border border-gray-200/80 dark:border-slate-700/80 flex items-center justify-between shadow-2xs"
  >
    <div class="flex items-center gap-3">
      <div
        class="w-8 h-8 rounded-lg bg-blue-100 dark:bg-[#5A8DEE]/20 text-[#5A8DEE] flex items-center justify-center"
      >
        <app-icon name="hash" size="w-4 h-4" />
      </div>
      <div>
        <span class="text-[11px] font-medium text-gray-500 dark:text-slate-400 block">
          Códigos Associados
        </span>
        <span class="text-sm font-bold text-gray-900 dark:text-slate-100">
          {{ totalAssociatedCodesCount() }} vínculos
        </span>
      </div>
    </div>
  </div>
</div>

<!-- Filter Toolbar -->
<app-toolbar>
  <div start class="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-3 w-full">
    <app-search-input
      [value]="searchQuery()"
      (valueChange)="onSearchChange($event)"
      placeholder="Filtrar por nome ou descrição..."
    />

    <app-select
      [value]="status()"
      (valueChange)="onStatusFilterChange($event)"
      [options]="statusFilterOptions()"
      placeholder="Todos os Status"
    />
  </div>

  <div end class="flex items-center gap-2">
    <app-button variant="ghost" size="sm" iconStart="refresh-cw" (btnClick)="resetFilters()">
      Limpar
    </app-button>
  </div>
</app-toolbar>

<!-- Table + Integrated Pagination Container -->
<div class="w-full">
  <app-data-table
    [columns]="columns"
    [data]="filteredCodeTypes()"
    [actions]="actions"
    [loading]="loading()"
    [roundedBottom]="false"
    (actionClick)="onActionClick($event)"
    emptyTitle="Nenhum Tipo de Código encontrado"
    emptyDescription="Tipos cadastrados definem a taxonomia de códigos secundários aplicáveis aos produtos do catálogo."
  />

  <app-pagination [pagination]="pagination()" (paginationChange)="onPaginationChange($event)" />
</div>

<!-- Code Type Form Drawer -->
<app-code-type-form
  [isOpen]="isFormOpen()"
  [mode]="formMode()"
  [codeType]="selectedCodeType()"
  (closeForm)="closeForm()"
  (codeTypeSaved)="onCodeTypeSaved()"
/>

<!-- Delete Confirmation Dialog -->
<app-confirm-dialog
  [isOpen]="deleteDialogOpen()"
  title="Excluir Tipo de Código"
  [message]="'Tem certeza de que deseja remover o tipo de código ' + (selectedForDelete()?.name || '') + '? Esta operação só é permitida se o tipo não estiver associado a nenhum produto.'"
  confirmText="Excluir Tipo"
  cancelText="Cancelar"
  type="danger"
  (confirmAction)="executeDelete()"
  (cancelAction)="deleteDialogOpen.set(false)"
/>
