<div class="bg-white dark:bg-slate-800 rounded-[12px] border border-gray-200/80 dark:border-slate-700/80 p-6 shadow-2xs space-y-6">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <!-- Preço Base -->
    <app-input
      label="Preço Base (R$)"
      [required]="true"
      placeholder="0,00"
      [value]="formPrice().toString()"
      [disabled]="isReadOnly()"
      [error]="errors()['price']"
      iconPrefix="dollar-sign"
      (valueChange)="onNumberFieldChange('price', $event)"
    />

    <!-- Preço Promocional -->
    <app-input
      label="Preço Promocional (R$)"
      placeholder="0,00"
      [value]="formPromotionalPrice() !== null ? formPromotionalPrice()!.toString() : ''"
      [disabled]="isReadOnly()"
      iconPrefix="dollar-sign"
      (valueChange)="onNullableNumberFieldChange('promotional_price', $event)"
    />
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <!-- Início da Promoção -->
    <app-input
      label="Início da Promoção"
      type="date"
      [value]="formPromotionStartDate() || ''"
      [disabled]="isReadOnly()"
      (valueChange)="onFieldChange('promotion_start_date', $event)"
    />

    <!-- Fim da Promoção -->
    <app-input
      label="Fim da Promoção"
      type="date"
      [value]="formPromotionEndDate() || ''"
      [disabled]="isReadOnly()"
      (valueChange)="onFieldChange('promotion_end_date', $event)"
    />
  </div>

  <!-- Indicador Produto Faturado -->
  <div class="pt-4 border-t border-gray-100 dark:border-slate-700/60 flex items-center justify-between">
    <div>
      <div class="flex items-center gap-2">
        <p class="text-sm font-semibold text-gray-900 dark:text-slate-200">Produto Faturado (Emissão de NFe)</p>
        <span
          class="px-2 py-0.5 text-[10px] font-bold rounded-full transition-colors"
          [class]="formIsInvoiced() ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-300 border border-emerald-300/50' : 'bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300 border border-amber-300/50'"
        >
          {{ formIsInvoiced() ? 'Faturado (Sim)' : 'Não Faturado (Não)' }}
        </span>
      </div>
      <p class="text-xs text-gray-500 dark:text-slate-400 mt-0.5">
        Indica se as saídas deste produto geram faturamento comercial e emissão de nota fiscal de venda.
      </p>
    </div>

    <button
      type="button"
      [disabled]="isReadOnly()"
      (click)="onToggleIsInvoiced()"
      [class]="formIsInvoiced() ? 'bg-[#4F8A6B]' : 'bg-gray-200 dark:bg-slate-700'"
      class="relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none disabled:opacity-50 disabled:cursor-not-allowed"
    >
      <span
        [class]="formIsInvoiced() ? 'translate-x-5' : 'translate-x-0'"
        class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out"
      ></span>
    </button>
  </div>
</div>
