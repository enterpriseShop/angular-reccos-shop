<div class="space-y-6">
  <!-- Aba OEM Codes -->
  @if (activeTab() === 'oem') {
  <app-product-oem
    [oemCodes]="oemCodes()"
    [isReadOnly]="isReadOnly()"
    [registeredOemCodes]="registeredOemCodes()"
    [selectedOemCodeIds]="selectedOemCodeIds()"
    (oemCodeIdsChange)="oemCodeIdsChange.emit($event)"
    (selectedOemCodeIdsChange)="selectedOemCodeIdsChange.emit($event)"
  />
  }

  <!-- Aba Códigos Adicionais -->
  @if (activeTab() === 'codigos') {
  <app-product-codes
    [isReadOnly]="isReadOnly()"
    [productCodes]="productCodes()"
    (addProductCode)="addProductCode.emit()"
    (removeProductCode)="removeProductCode.emit($event)"
    (toggleProductCodeStatus)="toggleProductCodeStatus.emit($event)"
  />
  }

  <!-- Aba Produtos Equivalentes -->
  @if (activeTab() === 'equivalentes') {
  <app-product-equivalents
    [equivalentProducts]="equivalentProducts()"
    [isReadOnly]="isReadOnly()"
    (addEquivalent)="addEquivalent.emit()"
    (removeEquivalent)="removeEquivalent.emit($event)"
    (toggleEquivalentStatus)="toggleEquivalentStatus.emit($event)"
  />
  }

  <!-- Aba Compatibilidade Veicular -->
  @if (activeTab() === 'compatibilidade') {
  <app-product-vehicle-applications
    [vehicleApplications]="vehicleApplications()"
    [isReadOnly]="isReadOnly()"
    (addVehicleApplication)="addVehicleApplication.emit()"
    (removeVehicleApplication)="removeVehicleApplication.emit($event)"
    (toggleVehicleStatus)="toggleVehicleStatus.emit($event)"
    (vehicleApplicationsChange)="vehicleApplicationsChange.emit($event)"
    (vehicleApplicationIdsChange)="vehicleApplicationIdsChange.emit($event)"
  />
  }
</div>
